name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ubuntu:20.04

    env:
      DOTNET_ROOT: /usr/share/dotnet
      SOLUTION: ./PlayStudios.MyService/PlayStudios.MyService.sln
      TEST_PROJECT: ./PlayStudios.MyService/PlayStudios.MyService.WebApi.Tests/PlayStudios.MyService.WebApi.Tests.csproj
      CONFIGURATION: Release
      COVERAGE_ENABLED: true

    steps:
      # ------------------------------------------------------------
      # Base tools required by GitHub Actions and CI
      # ------------------------------------------------------------
      - name: Install base tools
        shell: bash
        run: |
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive

          apt-get update

          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            wget \
            git \
            jq \
            unzip \
            zip \
            tar \
            gzip \
            bash \
            openssh-client \
            gnupg \
            apt-transport-https \
            software-properties-common

          rm -rf /var/lib/apt/lists/*

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # .NET Core 3.1
      #
      # .NET Core 3.1.0 release uses SDK 3.1.100
      # ------------------------------------------------------------
      - name: Setup .NET Core 3.1
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.1.100'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Verify .NET
        shell: bash
        run: |
          set -euo pipefail

          echo "dotnet version:"
          dotnet --version

          echo
          echo "Installed SDKs:"
          dotnet --list-sdks

          echo
          echo "Installed runtimes:"
          dotnet --list-runtimes

      # ------------------------------------------------------------
      # Restore
      # ------------------------------------------------------------
      - name: Restore
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore "$SOLUTION"

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          dotnet build "$SOLUTION" \
            --configuration "$CONFIGURATION" \
            --no-restore

      # ------------------------------------------------------------
      # Test
      # ------------------------------------------------------------
      - name: Test
        shell: bash
        run: |
          set -euo pipefail

          target="$SOLUTION"

          if [[ -n "$TEST_PROJECT" ]]; then
            target="$TEST_PROJECT"
          fi

          args=(
            test "$target"
            --configuration "$CONFIGURATION"
            --no-build
            --logger "trx;LogFileName=tests.trx"
          )

          if [[ "$COVERAGE_ENABLED" == "true" ]]; then
            args+=(--collect:"XPlat Code Coverage")
          fi

          dotnet "${args[@]}"

      # ------------------------------------------------------------
      # Upload test results
      # ------------------------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/*.xml
          if-no-files-found: warn