name: Reusable .NET CI

on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: false
        default: 8.0.x

      solution:
        type: string
        required: true

      configuration:
        type: string
        required: false
        default: Release

      test-project:
        type: string
        required: false
        default: ""

      coverage-enabled:
        type: boolean
        required: false
        default: true

      sonarqube-enabled:
        type: boolean
        required: false
        default: false

      sonar-project-key:
        type: string
        required: false
        default: ""

      security-scan-enabled:
        type: boolean
        required: false
        default: true

      trivy-version:
        type: string
        required: false
        default: "0.67.2"

      trivy-severity:
        type: string
        required: false
        default: "HIGH,CRITICAL"

      trivy-ignore-unfixed:
        type: boolean
        required: false
        default: true

      trivy-fail-on-vulnerability:
        type: boolean
        required: false
        default: true

    secrets:
      SONAR_TOKEN:
        required: false

jobs:
  ci:
    runs-on: ubuntu-latest

    # The GitHub-hosted runner is still ubuntu-latest,
    # but the job itself runs inside an environment compatible
    # with .NET Core 3.1.
    container:
      image: ubuntu:20.04

    permissions:
      contents: read

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:

      # ------------------------------------------------------------
      # Base tools
      # ------------------------------------------------------------
      - name: Install base tools
        shell: bash
        run: |
          set -euo pipefail

          apt-get update

          apt-get install -y --no-install-recommends \
            bash \
            ca-certificates \
            curl \
            wget \
            git \
            jq \
            unzip \
            zip \
            tar \
            gzip \
            xz-utils \
            openssh-client \
            gnupg \
            apt-transport-https \
            software-properties-common

          rm -rf /var/lib/apt/lists/*


      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # .NET SDK
      # ------------------------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          cache: true
          cache-dependency-path: '**/*.csproj'


      # ------------------------------------------------------------
      # Verify .NET environment
      # ------------------------------------------------------------
      - name: Verify .NET
        shell: bash
        run: |
          set -euo pipefail

          echo "DOTNET_ROOT=${DOTNET_ROOT:-}"

          echo
          echo "dotnet version:"
          dotnet --version

          echo
          echo "Installed SDKs:"
          dotnet --list-sdks

          echo
          echo "Installed runtimes:"
          dotnet --list-runtimes


      # ------------------------------------------------------------
      # Restore
      # ------------------------------------------------------------
      - name: Restore
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore "${{ inputs.solution }}"


      # ------------------------------------------------------------
      # SonarQube - Begin
      # ------------------------------------------------------------
      - name: Begin SonarQube analysis
        if: ${{ inputs.sonarqube-enabled }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ inputs.sonar-project-key }}
        run: |
          set -euo pipefail

          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "sonarqube-enabled requires SONAR_TOKEN." >&2
            exit 1
          fi

          if [[ -z "$SONAR_PROJECT_KEY" ]]; then
            echo "sonarqube-enabled requires sonar-project-key." >&2
            exit 1
          fi

          dotnet tool install --global dotnet-sonarscanner

          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

          export PATH="$HOME/.dotnet/tools:$PATH"

          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml"


      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          dotnet build "${{ inputs.solution }}" \
            --configuration "${{ inputs.configuration }}" \
            --no-restore


      # ------------------------------------------------------------
      # Unit tests
      # ------------------------------------------------------------
      - name: Unit tests
        shell: bash
        env:
          TEST_PROJECT: ${{ inputs.test-project }}
          SOLUTION: ${{ inputs.solution }}
          CONFIGURATION: ${{ inputs.configuration }}
          COVERAGE_ENABLED: ${{ inputs.coverage-enabled }}
        run: |
          set -euo pipefail

          target="$SOLUTION"

          if [[ -n "$TEST_PROJECT" ]]; then
            target="$TEST_PROJECT"
          fi

          args=(
            test "$target"
            --configuration "$CONFIGURATION"
            --no-build
            --logger "trx;LogFileName=tests.trx"
          )

          if [[ "$COVERAGE_ENABLED" == "true" ]]; then
            args+=(--collect:"XPlat Code Coverage")
          fi

          dotnet "${args[@]}"


      # ------------------------------------------------------------
      # SonarQube - End
      # ------------------------------------------------------------
      - name: End SonarQube analysis
        if: ${{ always() && inputs.sonarqube-enabled }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          export PATH="$HOME/.dotnet/tools:$PATH"

          dotnet sonarscanner end \
            /d:sonar.token="$SONAR_TOKEN"


      # ------------------------------------------------------------
      # Install Trivy
      # ------------------------------------------------------------
      - name: Install Trivy
        if: ${{ inputs.security-scan-enabled }}
        shell: bash
        env:
          TRIVY_VERSION: ${{ inputs.trivy-version }}
        run: |
          set -euo pipefail

          ARCH="$(dpkg --print-architecture)"

          case "$ARCH" in
            amd64)
              TRIVY_ARCH="64bit"
              ;;
            arm64)
              TRIVY_ARCH="ARM64"
              ;;
            *)
              echo "Unsupported architecture: $ARCH" >&2
              exit 1
              ;;
          esac

          curl -fsSL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-${TRIVY_ARCH}.tar.gz" \
            -o /tmp/trivy.tar.gz

          tar -xzf /tmp/trivy.tar.gz \
            -C /tmp

          install -m 0755 \
            /tmp/trivy \
            /usr/local/bin/trivy

          rm -f /tmp/trivy.tar.gz /tmp/trivy

          trivy --version


      # ------------------------------------------------------------
      # Trivy filesystem vulnerability scan
      # ------------------------------------------------------------
      - name: Trivy filesystem vulnerability scan
        if: ${{ inputs.security-scan-enabled }}
        shell: bash
        env:
          TRIVY_SEVERITY: ${{ inputs.trivy-severity }}
          TRIVY_IGNORE_UNFIXED: ${{ inputs.trivy-ignore-unfixed }}
          TRIVY_FAIL_ON_VULNERABILITY: ${{ inputs.trivy-fail-on-vulnerability }}
        run: |
          set -euo pipefail

          args=(
            fs
            --scanners vuln
            --severity "$TRIVY_SEVERITY"
            --format table
          )

          if [[ "$TRIVY_IGNORE_UNFIXED" == "true" ]]; then
            args+=(--ignore-unfixed)
          fi

          if [[ "$TRIVY_FAIL_ON_VULNERABILITY" == "true" ]]; then
            args+=(--exit-code 1)
          else
            args+=(--exit-code 0)
          fi

          args+=(.)

          trivy "${args[@]}"


      # ------------------------------------------------------------
      # Upload test results / coverage
      # ------------------------------------------------------------
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-${{ github.run_id }}
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore
          retention-days: 14