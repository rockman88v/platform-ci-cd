name: Reusable .NET CI

on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: false
        default: 8.0.x

      solution:
        type: string
        required: true

      configuration:
        type: string
        required: false
        default: Release

      test-project:
        type: string
        required: false
        default: ""

      coverage-enabled:
        type: boolean
        required: false
        default: true

      sonarqube-enabled:
        type: boolean
        required: false
        default: false

      sonar-project-key:
        type: string
        required: false
        default: ""

      security-scan-enabled:
        type: boolean
        required: false
        default: true

    secrets:
      SONAR_TOKEN:
        required: false

jobs:
  ci:
    runs-on: ubuntu-latest

    container:
      image: ubuntu:20.04

    permissions:
      contents: read

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      # ------------------------------------------------------------
      # Base tools
      # ------------------------------------------------------------
      - name: Install base tools
        shell: bash
        run: |
          set -euo pipefail

          apt-get update

          apt-get install -y --no-install-recommends \
            bash \
            ca-certificates \
            curl \
            wget \
            git \
            jq \
            unzip \
            zip \
            tar \
            gzip \
            xz-utils \
            openssh-client \
            gnupg \
            apt-transport-https \
            software-properties-common

          rm -rf /var/lib/apt/lists/*

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # .NET SDK
      #
      # For .NET Core 3.1 application:
      #   dotnet-version: 3.1.100
      #
      # For modern applications:
      #   dotnet-version: 8.0.x
      # ------------------------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Verify .NET
        shell: bash
        run: |
          set -euo pipefail

          echo "DOTNET_ROOT=${DOTNET_ROOT:-}"

          echo
          echo "dotnet version:"
          dotnet --version

          echo
          echo "Installed SDKs:"
          dotnet --list-sdks

          echo
          echo "Installed runtimes:"
          dotnet --list-runtimes

      # ------------------------------------------------------------
      # Restore
      # ------------------------------------------------------------
      - name: Restore
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore "${{ inputs.solution }}"

      # ------------------------------------------------------------
      # SonarQube - Begin
      # ------------------------------------------------------------
      - name: Begin SonarQube analysis
        if: ${{ inputs.sonarqube-enabled }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ inputs.sonar-project-key }}
        run: |
          set -euo pipefail

          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "sonarqube-enabled requires SONAR_TOKEN." >&2
            exit 1
          fi

          if [[ -z "$SONAR_PROJECT_KEY" ]]; then
            echo "sonarqube-enabled requires sonar-project-key." >&2
            exit 1
          fi

          dotnet tool install --global dotnet-sonarscanner

          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

          export PATH="$HOME/.dotnet/tools:$PATH"

          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml"

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          dotnet build "${{ inputs.solution }}" \
            --configuration "${{ inputs.configuration }}" \
            --no-restore

      # ------------------------------------------------------------
      # Unit tests
      # ------------------------------------------------------------
      - name: Unit tests
        shell: bash
        env:
          TEST_PROJECT: ${{ inputs.test-project }}
          SOLUTION: ${{ inputs.solution }}
          CONFIGURATION: ${{ inputs.configuration }}
          COVERAGE_ENABLED: ${{ inputs.coverage-enabled }}
        run: |
          set -euo pipefail

          target="$SOLUTION"

          if [[ -n "$TEST_PROJECT" ]]; then
            target="$TEST_PROJECT"
          fi

          args=(
            test "$target"
            --configuration "$CONFIGURATION"
            --no-build
            --logger "trx;LogFileName=tests.trx"
          )

          if [[ "$COVERAGE_ENABLED" == "true" ]]; then
            args+=(--collect:"XPlat Code Coverage")
          fi

          dotnet "${args[@]}"

      # ------------------------------------------------------------
      # SonarQube - End
      # ------------------------------------------------------------
      - name: End SonarQube analysis
        if: ${{ always() && inputs.sonarqube-enabled }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          export PATH="$HOME/.dotnet/tools:$PATH"

          dotnet sonarscanner end \
            /d:sonar.token="$SONAR_TOKEN"

      # ------------------------------------------------------------
      # Dependency vulnerability report
      # ------------------------------------------------------------
      - name: Dependency vulnerability report
        if: ${{ inputs.security-scan-enabled }}
        shell: bash
        run: |
          set -euo pipefail

          dotnet list "${{ inputs.solution }}" package \
            --vulnerable \
            --include-transitive

      # ------------------------------------------------------------
      # Upload test results / coverage
      # ------------------------------------------------------------
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-${{ github.run_id }}
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore
          retention-days: 14