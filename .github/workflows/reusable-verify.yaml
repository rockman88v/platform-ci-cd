name: Reusable deployment verification
on:
  workflow_call:
    inputs:
      runner:
        required: false
        type: string
        default: ubuntu-latest
      environment:
        type: string
        required: true
      config-file:
        type: string
        required: false
        default: deploy.yaml
      upstream-run-id:
        type: string
        required: true
      lifecycle-type:
        description: "Lifecycle operation that triggered verification"
        required: false
        type: string
        default: promotion
    secrets:
      GITOPS_READ_TOKEN:
        required: false
      ARGOCD_AUTH_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    # environment:
    #   name: ${{ inputs.environment }}
    steps:
      - name: Prepare self-hosted runner
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Runner information ==="
          echo "Runner:        ${RUNNER_NAME:-unknown}"
          echo "OS:             ${RUNNER_OS:-unknown}"
          echo "Architecture:   ${RUNNER_ARCH:-unknown}"
          echo "Hostname:       $(hostname)"
          echo

          echo "=== Check base tools ==="

          command -v git || {
            echo "ERROR: git is not installed"
            exit 1
          }

          command -v curl || {
            echo "ERROR: curl is not installed"
            exit 1
          }

          # ----------------------------------------------------------
          # Install GitHub CLI if missing
          # ----------------------------------------------------------

          if ! command -v gh >/dev/null 2>&1; then
            echo "gh not found. Installing GitHub CLI..."

            if command -v apt-get >/dev/null 2>&1; then
              if [ "$(id -u)" -eq 0 ]; then
                apt-get update
                apt-get install -y gh
              elif command -v sudo >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y gh
              else
                echo "ERROR: apt-get exists but runner has neither root nor sudo"
                exit 1
              fi
            else
              echo "ERROR: Cannot install gh automatically."
              echo "This runner does not have apt-get."
              exit 1
            fi
          fi

          # ----------------------------------------------------------
          # jq
          # ----------------------------------------------------------

          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found. Installing..."

            if [ "$(id -u)" -eq 0 ]; then
              apt-get update
              apt-get install -y jq
            elif command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y jq
            else
              echo "ERROR: Cannot install jq"
              exit 1
            fi
          fi

          # ----------------------------------------------------------
          # Python
          # ----------------------------------------------------------

          if ! command -v python3 >/dev/null 2>&1; then
            echo "python3 not found. Installing..."

            if [ "$(id -u)" -eq 0 ]; then
              apt-get update
              apt-get install -y python3 python3-pip
            elif command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y python3 python3-pip
            else
              echo "ERROR: Cannot install python3"
              exit 1
            fi
          fi

          # ----------------------------------------------------------
          # PyYAML
          # ----------------------------------------------------------

          if ! python3 -c 'import yaml' >/dev/null 2>&1; then
            echo "PyYAML not found. Installing..."

            if python3 -m pip install --help >/dev/null 2>&1; then
              python3 -m pip install --user PyYAML
            else
              if [ "$(id -u)" -eq 0 ]; then
                apt-get update
                apt-get install -y python3-yaml
              elif command -v sudo >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y python3-yaml
              else
                echo "ERROR: Cannot install PyYAML"
                exit 1
              fi
            fi
          fi

          echo
          echo "=== Tool versions ==="
          git --version
          gh --version
          jq --version
          python3 --version
          python3 -c 'import yaml; print("PyYAML:", yaml.__version__)'

          echo
          echo "Runner preparation completed."      
      # - name: Validate upstream lifecycle run
      #   shell: bash
      #   env:
      #     GH_TOKEN: ${{ github.token }}
      #     UPSTREAM_RUN_ID: ${{ inputs.upstream-run-id }}
      #     TARGET_ENV: ${{ inputs.environment }}
      #   run: |
      #     set -euo pipefail
      #     run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}")"
      #     expected_name="Deploy DEV"
      #     if [[ "$TARGET_ENV" == "staging" ]]; then
      #       expected_name="Promote STAGING"
      #     elif [[ "$TARGET_ENV" == "production" ]]; then
      #       expected_name="Promote PRODUCTION"
      #     fi
      #     [[ "$(jq -r .name <<< "$run_json")" == "$expected_name" ]]
      #     [[ "$(jq -r .status <<< "$run_json")" == "completed" ]]
      #     [[ "$(jq -r .conclusion <<< "$run_json")" == "success" ]]
      #     [[ "$(jq -r .head_repository.full_name <<< "$run_json")" == "$GITHUB_REPOSITORY" ]]

      - name: Validate upstream lifecycle run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ inputs.upstream-run-id }}
          TARGET_ENV: ${{ inputs.environment }}
          LIFECYCLE_TYPE: ${{ inputs.lifecycle-type }}
        run: |
          set -euo pipefail

          run_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}"
          )"

          actual_name="$(jq -r '.name' <<< "$run_json")"
          status="$(jq -r '.status' <<< "$run_json")"
          conclusion="$(jq -r '.conclusion' <<< "$run_json")"
          head_repository="$(jq -r '.head_repository.full_name' <<< "$run_json")"

          echo "Upstream lifecycle run:"
          echo "  Run ID:          $UPSTREAM_RUN_ID"
          echo "  Name:            $actual_name"
          echo "  Status:          $status"
          echo "  Conclusion:      $conclusion"
          echo "  Repository:      $head_repository"
          echo "  Target env:      $TARGET_ENV"
          echo "  Lifecycle type:  $LIFECYCLE_TYPE"

          case "$LIFECYCLE_TYPE" in
            promotion)
              expected_name=""

              case "$TARGET_ENV" in
                test)
                  expected_name="Deploy DEV"
                  ;;
                staging)
                  expected_name="Promote STAGING"
                  ;;
                production)
                  expected_name="Promote PRODUCTION"
                  ;;
                *)
                  echo "Unsupported promotion target environment: $TARGET_ENV" >&2
                  exit 1
                  ;;
              esac
              ;;

            rollback)
              if [[ "$TARGET_ENV" != "production" ]]; then
                echo "Rollback is currently supported only for production." >&2
                exit 1
              fi

              expected_name="Rollback PRODUCTION"
              ;;

            *)
              echo "Unsupported lifecycle type: $LIFECYCLE_TYPE" >&2
              exit 1
              ;;
          esac

          echo "Expected upstream workflow: $expected_name"

          [[ "$actual_name" == "$expected_name" ]] || {
            echo "Invalid upstream workflow name." >&2
            echo "Expected: $expected_name" >&2
            echo "Actual:   $actual_name" >&2
            exit 1
          }

          [[ "$status" == "completed" ]] || {
            echo "Upstream workflow is not completed." >&2
            exit 1
          }

          [[ "$conclusion" == "success" ]] || {
            echo "Upstream workflow did not succeed." >&2
            exit 1
          }

          [[ "$head_repository" == "$GITHUB_REPOSITORY" ]] || {
            echo "Upstream workflow belongs to another repository." >&2
            exit 1
          }

          echo "Upstream lifecycle run validation passed."

      - uses: actions/download-artifact@v4
        with:
          name: release-context
          path: release-context
          repository: ${{ github.repository }}
          run-id: ${{ inputs.upstream-run-id }}
          github-token: ${{ github.token }}
      - id: context
        name: Read originating source SHA
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(jq -er '.sourceSha | strings | select(test("^[a-fA-F0-9]{40}$"))' release-context/release-context.json)"
          build_run_id="$(jq -er '.buildRunId | strings | select(test("^[0-9]+$"))' release-context/release-context.json)"
          echo "source-sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "build-run-id=$build_run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.source-sha }}
      - name: Read deployment config
        id: config
        uses: rockman88v/platform-ci-cd/.github/actions/read-deploy-config@main
        with:
          config-file: ${{ inputs.config-file }}
          environment: ${{ inputs.environment }}
      - uses: actions/download-artifact@v4
        with:
          name: image-metadata
          path: image-metadata
          repository: ${{ github.repository }}
          run-id: ${{ steps.context.outputs.build-run-id }}
          github-token: ${{ github.token }}
      - id: metadata
        uses: rockman88v/platform-ci-cd/.github/actions/image-metadata@main
        with:
          mode: read
          metadata-file: image-metadata/image-metadata.json
      - name: Enforce build metadata source SHA
        env:
          EXPECTED_SHA: ${{ steps.context.outputs.source-sha }}
          ARTIFACT_SHA: ${{ steps.metadata.outputs.git-sha }}
        run: test "$EXPECTED_SHA" = "$ARTIFACT_SHA"
      - name: Enforce configured image repository
        env:
          CONFIGURED_REPOSITORY: ${{ steps.config.outputs.image-repository }}
          ARTIFACT_REPOSITORY: ${{ steps.metadata.outputs.image-repository }}
        run: test "$CONFIGURED_REPOSITORY" = "$ARTIFACT_REPOSITORY"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.config.outputs.gitops-repository }}
          token: ${{ secrets.GITOPS_READ_TOKEN }}
          path: gitops
          persist-credentials: false      
      - uses: rockman88v/platform-ci-cd/.github/actions/wait-argocd@main
        with:
          server: ${{ steps.config.outputs.argo-server }}
          application: ${{ steps.config.outputs.argo-application }}
          timeout: "600"
          auth-token: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      - name: Verify GitOps environment points at build digest
        shell: bash
        env:
          VALUES_FILE: gitops/${{ steps.config.outputs.chart-path }}/${{ steps.config.outputs.values-file }}
          EXPECTED_DIGEST: ${{ steps.metadata.outputs.image-digest }}
          EXPECTED_TAG: ${{ steps.metadata.outputs.image-tag }}
          EXPECTED_REPOSITORY: ${{ steps.metadata.outputs.image-repository }}
        run: |
          set -euo pipefail
          actual_digest="$(python3 -c 'import sys,yaml; print(yaml.safe_load(open(sys.argv[1]))["microservice"]["image"]["digest"])' "$VALUES_FILE")"
          actual_tag="$(python3 -c 'import sys,yaml; print(yaml.safe_load(open(sys.argv[1]))["microservice"]["image"]["tag"])' "$VALUES_FILE")"
          actual_repository="$(python3 -c 'import sys,yaml; print(yaml.safe_load(open(sys.argv[1]))["microservice"]["image"]["repository"])' "$VALUES_FILE")"
          [[ "$actual_digest" == "$EXPECTED_DIGEST" && "$actual_tag" == "$EXPECTED_TAG" && "$actual_repository" == "$EXPECTED_REPOSITORY" ]] || {
            echo "GitOps image identity does not match the verified build artifact." >&2
            exit 1
          }
      - uses: rockman88v/platform-ci-cd/.github/actions/smoke-test@main
        if: ${{ steps.config.outputs.smoke-enabled == 'true' }}
        with:
          base-url: ${{ steps.config.outputs.base-url }}
          test-path: ${{ steps.config.outputs.smoke-path }}
          timeout: 5m
      - uses: rockman88v/platform-ci-cd/.github/actions/e2e-test@main
        if: ${{ steps.config.outputs.e2e-enabled == 'true' }}
        with:
          test-framework: ${{ steps.config.outputs.e2e-framework }}
          base-url: ${{ steps.config.outputs.base-url }}
          test-path: ${{ steps.config.outputs.e2e-path }}
          timeout: 15m
      - name: Preserve release context for the next workflow
        env:
          SOURCE_SHA: ${{ steps.context.outputs.source-sha }}
          BUILD_RUN_ID: ${{ steps.context.outputs.build-run-id }}
        run: jq -n --arg sourceSha "$SOURCE_SHA" --arg buildRunId "$BUILD_RUN_ID" '{sourceSha:$sourceSha,buildRunId:$buildRunId}' > release-context.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-context
          path: release-context.json
          if-no-files-found: error
          retention-days: 90
